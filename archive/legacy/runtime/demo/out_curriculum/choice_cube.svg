  <text x="266" y="250" fill="#000000" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Y  8509/50</text>
  <text x="266" y="262" fill="#000000" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Co 40</text>
  <text x="266" y="274" fill="#000000" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Cg -30</text>
