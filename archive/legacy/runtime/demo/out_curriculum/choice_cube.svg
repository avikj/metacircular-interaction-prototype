  <text x="366" y="214" fill="#000000" font-family="monospace" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">111</text>
  <text x="366" y="232" fill="#000000" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">#a7bb57</text>
  <text x="366" y="250" fill="#000000" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Y  8481/50</text>
  <text x="366" y="262" fill="#000000" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Co 40</text>
  <text x="366" y="274" fill="#000000" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Cg 30</text>
  <rect x="358" y="196" width="92" height="92" fill="none" stroke="#000000" stroke-width="3" shape-rendering="crispEdges"/>
  <text x="478" y="100" fill="#111111" font-family="monospace" font-size="12" font-weight="bold" text-anchor="start" xml:space="preserve">the three axes</text>
  <text x="478" y="120" fill="#111111" font-family="monospace" font-size="11" font-weight="normal" text-anchor="start" xml:space="preserve">base  -&gt;  Co</text>
  <text x="478" y="133" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">base b (a finite quotient N -&gt; Z/b)</text>
  <text x="478" y="150" fill="#111111" font-family="monospace" font-size="11" font-weight="normal" text-anchor="start" xml:space="preserve">endianness  -&gt;  Cg</text>
  <text x="478" y="163" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">endianness (a trivialization of the Z/2-torsor</text>
  <text x="478" y="180" fill="#111111" font-family="monospace" font-size="11" font-weight="normal" text-anchor="start" xml:space="preserve">carry  -&gt;  Y</text>
  <text x="478" y="193" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">carry (a digit section with nonzero class in H</text>
  <text x="478" y="224" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">heavy outline: all three fixed = a numeral</text>
  <text x="16" y="326" fill="#111111" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start" xml:space="preserve">Separability, proved exhaustively over all 24 flips:</text>
  <text x="16" y="342" fill="#333333" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">flipping one choice moves its own component by at least 60 and every other component by at most 14/25</text>
  <text x="16" y="356" fill="#333333" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">quantisation bound 1; layers claim disjoint components (True); eight distinct colours (True); clamped 0</text>
  <text x="16" y="378" fill="#555555" font-family="monospace" font-size="10" font-weight="bold" text-anchor="start" xml:space="preserve">What a reader could misread:</text>
  <text x="16" y="392" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">(a) the three axes are separable in the CHART, not orthogonal as mathematics: the torsor of endianness is a torsor of truncation</text>
  <text x="16" y="404" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">      systems on (Z/b^n)_n, so it is not even definable until the base is fixed (ATLAS_OF_N Proposition 2.10).</text>
  <text x="16" y="418" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">(b) &apos;carry = 0&apos; is not a carry-free numeral. No digit section makes the class vanish (Corollary 2.11.1); 0 here means</text>
  <text x="16" y="430" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">      the parameter has not been chosen yet, not that it was chosen to be trivial.</text>
  <text x="16" y="444" fill="#777777" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">(c) the opponent surrogate is not CIELAB and is not perceptually uniform (runtime/render/README.md Sec.3).</text>
</svg>
