  <text x="266" y="174" fill="#ffffff" font-family="monospace" font-size="9" font-weight="normal" text-anchor="start" xml:space="preserve">Cg -30</text>
  <rect x="358" y="96" width="92" height="92" fill="#6b7f1b" stroke="#bbbbbb" stroke-width="1" shape-rendering="crispEdges"><title>base=1 endianness=1 carry=0  #6b7f1b  Y=5481/50 Co=40 Cg=30</title></rect>
