<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="732" height="578" viewBox="0 0 732 578" version="1.1">
  <title>The three choices of positional notation, separated</title>
  <desc>Eight states = the eight subsets of {base, endianness, carry}. Each parameter of ATLAS_OF_N Theorem 4.2(2) drives exactly one opponent component.</desc>
  <rect x="0" y="0" width="732" height="578" fill="#ffffff" shape-rendering="crispEdges"/>
  <text x="16" y="26" fill="#111111" font-family="monospace" font-size="16" font-weight="bold" text-anchor="start" xml:space="preserve">Positional notation = three choices, and they are independent</text>
  <text x="16" y="44" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">ATLAS_OF_N.md Theorem 4.2(2): a base (a finite quotient), an endianness (a trivialization of a Z/2-torsor), and a carry (a 2-cocycle whose class is never zero).</text>
  <text x="16" y="58" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">Each drives one component of the exact opponent space: base -&gt; Co, endianness -&gt; Cg, carry -&gt; Y.</text>
  <text x="16" y="86" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="start" xml:space="preserve">carry</text>
  <text x="104" y="86" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="middle" xml:space="preserve">b=0 e=0</text>
  <text x="204" y="86" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="middle" xml:space="preserve">b=0 e=1</text>
  <text x="304" y="86" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="middle" xml:space="preserve">b=1 e=0</text>
  <text x="404" y="86" fill="#555555" font-family="monospace" font-size="10" font-weight="normal" text-anchor="middle" xml:space="preserve">b=1 e=1</text>
  <text x="16" y="142" fill="#555555" font-family="monospace" font-size="12" font-weight="normal" text-anchor="start" xml:space="preserve">0</text>
  <rect x="58" y="96" width="92" height="92" fill="#715dc1" stroke="#bbbbbb" stroke-width="1" shape-rendering="crispEdges"><title>base=0 endianness=0 carry=0  #715dc1  Y=5519/50 Co=-40 Cg=-30</title></rect>
  <text x="66" y="114" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="start" xml:space="preserve">000</text>
