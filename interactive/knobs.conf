# machine/knobs.conf -- MathMachine's KNOBS, as data.
#
# Written by machine/Knobs.hs.  Keys are the engine's own
# identifiers; `#` comments to end of line; absent keys take their
# default.  An unknown key, a repeated key, a non-integer value or
# an out-of-range value is a hard error, not a warning.
#
# Each range is labelled SEMANTIC (derived from the engine's code,
# stated with its derivation in machine/Knobs.hs) or GUARD (a fence
# against a typo, with no mathematical content).
#
# Nothing reads this file and then rewrites MathMachine.hs.  A
# setting gets adopted when a person adopts it.

# kProbe: size of the term sample the value gates are measured on
#   range [1, 1000000]  (Semantic floor, Guard ceiling)
kProbe = 400

# kAssign: how many random environments a fingerprint is taken over
#   range [1, 100000]  (Semantic floor, Guard ceiling)
kAssign = 40

# kMinPrune: normal forms a theorem must collapse before it is kept
#   range [0, 1000000]  (Semantic floor, Guard ceiling)
kMinPrune = 1

# kConceptMin: times a shape must recur before it is a naming candidate
#   range [1, 1000000]  (Semantic floor, Guard ceiling)
kConceptMin = 8

# kConceptGain: symbols a new name must save across the probe
#   range [0, 1000000]  (Semantic floor, Guard ceiling)
kConceptGain = 8

# kVars: distinct variables the term generator may use
#   range [1, 6]  (Semantic floor, Semantic ceiling)
kVars = 3

# kSizeCap: ceiling the size horizon may deepen to
#   range [1, 32]  (Semantic floor, Guard ceiling)
kSizeCap = 7

# Coherence law, derived and checked at load time:
#   kMinPrune < kProbe, because marginalPrune <= kProbe - 1.
