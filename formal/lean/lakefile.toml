name = "pairfield"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Pairfield", "yogyanupalabdhi"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Pairfield"
# Without `globs`, `lake build` builds only `Pairfield.lean` and its import
# closure; 21 modules under `Pairfield/` were built by nothing, and 3 of them
# did not typecheck (notes/LEAN_LANE_AUDIT.md §1). `Pairfield.+` makes the
# library the whole directory, so a module cannot hide by not being imported.
globs = ["Pairfield", "Pairfield.+"]

# The axiom check (notes/AXIOM_GATE.md).  Lean has no `--safe` flag; this
# executable is the lane's substitute: `lake exe yogyanupalabdhi` after a build
# rejects any lane declaration resting on an axiom outside
# {propext, Classical.choice, Quot.sound} and the commented allowlist.
#
# It is NOT part of `lean_lib Pairfield` and should not be: an executable root
# has no business inside a library glob.  What WAS wrong until 2026-08-20 is
# that it was not a default target either, so `lake build` returned 8840 jobs
# and exit 0 without compiling the one program that checks the axioms -- the
# binary could be deleted and the build stayed green (verified by deleting it).
# It is now in `defaultTargets`, so `lake build` builds the checker too.
[[lean_exe]]
name = "yogyanupalabdhi"
root = "YogyaAnupalabdhi_TheAxiomCheckStatesWhereItCouldHaveSeen"
