name: Cubical list transport

on:
  pull_request:
    paths:
      - 'collab/bend2-interactive-cubical/vendor/**'
      - 'collab/bend2-interactive-cubical/test_list_transport.py'
      - '.github/workflows/cubical-list-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-list-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the vendored HVM4 runtime
        shell: bash
        run: |
          set -euo pipefail
          cc -O2 -o "$RUNNER_TEMP/hvm" collab/bend2-interactive-cubical/vendor/HVM4/src/hvm.c -lm
          mkdir "$RUNNER_TEMP/list-transport-source"
          cp collab/bend2-interactive-cubical/vendor/HVM4/src/hvm.c collab/bend2-interactive-cubical/vendor/Bend2/src/Target/HVM4Full.hs collab/bend2-interactive-cubical/test_list_transport.py "$RUNNER_TEMP/list-transport-source/"
      - name: Reproduce the old bug and test the fixed runtime
        run: python3 collab/bend2-interactive-cubical/test_list_transport.py --hvm "$RUNNER_TEMP/hvm"
      - name: Retain the exact sources used by the regression
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: list-transport-source
          path: ${{ runner.temp }}/list-transport-source/
          retention-days: 7
          if-no-files-found: warn
