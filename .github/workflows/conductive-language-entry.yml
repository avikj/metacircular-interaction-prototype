name: Conductive language entry
on:
  pull_request:
    paths:
      - 'collab/bend2-interactive-cubical/**'
      - 'research/sat_fibre/SATProcess.bend'
      - '.github/workflows/conductive-language-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          cabal-version: '3.14.2.0'
      - name: Bootstrap exact Cubical Bend2 and HVM runtimes
        shell: bash
        run: |
          set -euo pipefail
          bash collab/bend2-interactive-cubical/mining/bootstrap.sh "$RUNNER_TEMP/conductive-build"
          cat "$RUNNER_TEMP/conductive-build/build-identity.txt"
      - name: Expose native proof-relevant Core reduction
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/native_step_smoke.bend --native-steps | tee "$RUNNER_TEMP/native-step.log"
          grep -q '^native-step: app
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          bash collab/bend2-interactive-cubical/verify_conductive_entry.sh "$BEND" "$HVM"
      - name: Verify intrinsic map/proposition presentation
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/conductive_map_smoke.bend --to-hvm4-full > "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '^@conductiveMapMain = ' "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '@cfPresentMap' "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '^@sourceMain = ' "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '^@main = @conductiveMain$' "$RUNNER_TEMP/conductive-map.hvm4"
      - name: Execute canonical checked conductive runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/port/ConductiveRuntime.bend --to-hvm4-full > "$RUNNER_TEMP/conductive-runtime-source.hvm4"
          "$HVM" "$RUNNER_TEMP/conductive-runtime-source.hvm4" -s | tee "$RUNNER_TEMP/conductive-runtime-source.log"
      - name: Execute canonical Bend universal presentation
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/universal_presentation.bend --to-hvm4-full > "$RUNNER_TEMP/universal-presentation.hvm4"
          "$HVM" "$RUNNER_TEMP/universal-presentation.hvm4" -s | tee "$RUNNER_TEMP/universal-presentation.log"
      - name: Run complete Cubical Bend suite
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          bash collab/bend2-interactive-cubical/suite.sh "$BEND"
      - name: Compile and execute SAT through intrinsic full runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          cd research/sat_fibre
          "$BEND" SATProcess.bend --to-hvm4-full > "$RUNNER_TEMP/SATProcess.hvm4"
          grep -q '^@conductiveWholeMain = @cfCoalgebra' "$RUNNER_TEMP/SATProcess.hvm4"
          grep -q '^@main = @conductiveMain$' "$RUNNER_TEMP/SATProcess.hvm4"
          ! grep -q '@wholeProcess' "$RUNNER_TEMP/SATProcess.hvm4"
          ! grep -q '@interact' "$RUNNER_TEMP/SATProcess.hvm4"
          "$HVM" "$RUNNER_TEMP/SATProcess.hvm4" -s | tee "$RUNNER_TEMP/sat-runtime.log"
      - name: Retain exact generated/runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conductive-language-entry-evidence
          path: |
            ${{ runner.temp }}/conductive-build/build-identity.txt
            ${{ runner.temp }}/conductive-build/bend-build.log
            ${{ runner.temp }}/conductive-build/hvm-build.log
            ${{ runner.temp }}/native-step.log
            ${{ runner.temp }}/conductive-map.hvm4
            ${{ runner.temp }}/conductive-runtime-source.hvm4
            ${{ runner.temp }}/universal-presentation.hvm4
            ${{ runner.temp }}/SATProcess.hvm4
            ${{ runner.temp }}/sat-runtime.log
          retention-days: 14
          if-no-files-found: warn
 "$RUNNER_TEMP/native-step.log"
          grep -q '^target: 2' "$RUNNER_TEMP/native-step.log"

      - name: Execute compiler-generated conductive path and continuation
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          bash collab/bend2-interactive-cubical/verify_conductive_entry.sh "$BEND" "$HVM"
      - name: Verify intrinsic map/proposition presentation
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/conductive_map_smoke.bend --to-hvm4-full > "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '^@conductiveMapMain = ' "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '@cfPresentMap' "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '^@sourceMain = ' "$RUNNER_TEMP/conductive-map.hvm4"
          grep -q '^@main = @conductiveMain$' "$RUNNER_TEMP/conductive-map.hvm4"
      - name: Execute canonical checked conductive runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/port/ConductiveRuntime.bend --to-hvm4-full > "$RUNNER_TEMP/conductive-runtime-source.hvm4"
          "$HVM" "$RUNNER_TEMP/conductive-runtime-source.hvm4" -s | tee "$RUNNER_TEMP/conductive-runtime-source.log"
      - name: Execute canonical Bend universal presentation
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          "$BEND" collab/bend2-interactive-cubical/universal_presentation.bend --to-hvm4-full > "$RUNNER_TEMP/universal-presentation.hvm4"
          "$HVM" "$RUNNER_TEMP/universal-presentation.hvm4" -s | tee "$RUNNER_TEMP/universal-presentation.log"
      - name: Run complete Cubical Bend suite
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          bash collab/bend2-interactive-cubical/suite.sh "$BEND"
      - name: Compile and execute SAT through intrinsic full runtime
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/conductive-build/env.sh"
          cd research/sat_fibre
          "$BEND" SATProcess.bend --to-hvm4-full > "$RUNNER_TEMP/SATProcess.hvm4"
          grep -q '^@conductiveWholeMain = @cfCoalgebra' "$RUNNER_TEMP/SATProcess.hvm4"
          grep -q '^@main = @conductiveMain$' "$RUNNER_TEMP/SATProcess.hvm4"
          ! grep -q '@wholeProcess' "$RUNNER_TEMP/SATProcess.hvm4"
          ! grep -q '@interact' "$RUNNER_TEMP/SATProcess.hvm4"
          "$HVM" "$RUNNER_TEMP/SATProcess.hvm4" -s | tee "$RUNNER_TEMP/sat-runtime.log"
      - name: Retain exact generated/runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conductive-language-entry-evidence
          path: |
            ${{ runner.temp }}/conductive-build/build-identity.txt
            ${{ runner.temp }}/conductive-build/bend-build.log
            ${{ runner.temp }}/conductive-build/hvm-build.log
            ${{ runner.temp }}/conductive-map.hvm4
            ${{ runner.temp }}/conductive-runtime-source.hvm4
            ${{ runner.temp }}/universal-presentation.hvm4
            ${{ runner.temp }}/SATProcess.hvm4
            ${{ runner.temp }}/sat-runtime.log
          retention-days: 14
          if-no-files-found: warn
