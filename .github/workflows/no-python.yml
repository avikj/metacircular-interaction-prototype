name: No new Python

# Human owner directive, 2026-08-13: Python is banned in this repository.
# This is the layer that catches whatever the local hooks did not — a clone
# without core.hooksPath set, a harness with no PreToolUse hook, a push from
# a machine nobody configured.
#
# Scope: new or modified .py/.pyi/.ipynb. Deletions always pass; migrating
# away from the existing corpus is the intent.

on:
  push:
  pull_request:

jobs:
  reject-new-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find added or modified Python
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          offenders=$(git diff --name-only --diff-filter=AM "$BASE" HEAD \
                      | grep -E '\.(py|pyi|ipynb)$' || true)
          if [ -n "$offenders" ]; then
            echo "BLOCKED: Python is banned in this repository (owner, 2026-08-13)."
            echo ""
            echo "Added or modified Python:"
            echo "$offenders" | sed 's/^/    /'
            echo ""
            echo "The substrate is Agda: formal/cubical/ (--cubical --safe, no"
            echo "postulates, no holes). The analytic lane uses Lean:"
            echo "formal/pairfield/."
            echo ""
            echo "A script that prints a number is an assertion a reader must"
            echo "trust. A checked term is the thing itself."
            exit 1
          fi
          echo "OK: no new Python."
