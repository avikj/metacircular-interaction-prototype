name: Formal lane gates

# Both lanes learned the same lesson on 2026-08-15, independently
# (notes/PIN_SWEEP_NATURALMACHINE.md, notes/LEAN_LANE_AUDIT.md):
#
#   * the Agda root aggregate did NOT reach every module under
#     NaturalMachine/ — 238 of 272, 34 orphans — although BUILD.md said
#     "CLOSED 2026-08-14 — the root now reaches every module". That
#     paragraph has now been wrong twice by the same mechanism;
#   * `lean_lib Pairfield` had no `globs`, so 21 modules were built by
#     nothing and 3 of them did not typecheck.
#
# In both cases the fact was discoverable in seconds and went undiscovered
# for a day because nothing ran. This workflow is the machinery. It costs
# no toolchain: the orphan checks are pure text analysis of import lines.
#
# WHAT THIS WORKFLOW DOES **NOT** DO — read notes/CI_FORMAL_GATES.md:
#   - it does not typecheck any Agda (Agda 2.8.0 is a ~75-minute Hackage
#     build; the pinned toolchain is not on any runner image);
#   - the Lean build is opt-in below, not push-gated, because
#     `lake exe cache get` pulls ~10 GB of mathlib oleans.
# Those two builds remain MANUAL. See notes/CI_FORMAL_GATES.md §3.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- #
  # No compiler required. This is the whole point: it always can run. #
  # ---------------------------------------------------------------- #
  import-closure:
    name: Aggregate closure and control quarantine (no toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agda — every module reachable from an aggregate root
        run: ./scripts/check-agda-closure.sh

      - name: Lean — lakefile globs cover the whole Pairfield tree
        run: ./scripts/check-lean-globs.sh

      # Agda's `--safe` is asserted PER MODULE by an OPTIONS pragma; a file
      # that omits it is typechecked without it, silently, and `formal/check.sh`
      # still prints nothing. notes/AXIOM_GATE.md §6.1 named this as the one
      # remaining asymmetry between the lanes and declined to gate on an
      # unmeasured property; notes/AGDA_PRAGMA_AUDIT.md is the measurement.
      # Pure text analysis of headers, so it runs wherever the closure checks do.
      - name: Agda — every module asserts --safe (and nothing --safe forbids)
        run: ./scripts/check-agda-pragmas.sh

      # The Lean axiom gate (lean-build job below) runs `collectAxioms` over
      # NAMED declarations only; an anonymous `example` emits no constant and
      # is structurally invisible to it. notes/AXIOM_GATE.md §7a. Pure text
      # analysis, no toolchain, so it runs in the cheap job rather than behind
      # the 10 GB mathlib cache.
      - name: Lean — no anonymous example rests on an oracle
        run: ./scripts/check-lean-example-oracles.sh

      # Claim references must resolve. IDs collide (ten live IDs carry two
      # claim files each); slugs do not (104 files, 104 distinct slugs).
      # Fails on a slug that names nothing; warns, non-fatally, on a bare
      # reference to an ambiguous ID. notes/CLAIM_ID_AMBIGUITY.md §6b.
      # Pure text analysis of tracked files, so it belongs in the cheap job.
      - name: Registry — every slug-qualified claim reference resolves
        run: ./scripts/check-claim-slugs.sh

      # A large pure deletion of ledger files must be announced in the commit
      # subject (notes/REGISTRY_DELETION_142bba1f.md). Over the pushed range
      # when GitHub supplies one, else HEAD. `fetch-depth: 0` is NOT set on the
      # checkout above, so before/after may be unreachable — the fallback is
      # deliberate, not a silent skip. The guard prints its own merge-commit
      # blind spot on every run.
      - name: Git — no silent mass deletion of ledger files
        run: |
          set -eu
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            ./scripts/check-no-silent-deletion.sh "$before..$after"
          else
            echo "no reachable before-commit; checking HEAD only"
            ./scripts/check-no-silent-deletion.sh "$after"
          fi

  # ------------------------------------------------------------------ #
  # Opt-in: ~10 GB mathlib cache. Not gated on push, so a landing is    #
  # never blocked on a 10 GB download; run it by hand or let the weekly #
  # schedule catch drift. NOT YET OBSERVED GREEN IN A RUNNER — see      #
  # notes/CI_FORMAL_GATES.md §2 on why no CI job in this repository has #
  # ever executed a step.                                              #
  # ------------------------------------------------------------------ #
  lean-build:
    name: lake build (opt-in, ~10 GB mathlib cache)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned toolchain
        run: |
          set -eu
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: formal/pairfield
        run: |
          set -eu
          lake exe cache get
          lake build

      # The axiom gate (notes/AXIOM_GATE.md).  Lean has no `--safe` flag; this
      # is the lane's substitute.  It runs only after a green build, because a
      # gate over a red build is theatre: a module that fails to compile has no
      # theorems to be tainted, and its absence would read as cleanliness.
      # Strictly stronger than grepping for `native_decide` — it sees taint
      # propagated through imports, and needs no list of escape-hatch names.
      - name: Axiom gate (collectAxioms over every Pairfield.* declaration)
        working-directory: formal/pairfield
        run: |
          set -eu
          lake exe axiom_gate
