name: Epistemic registry

on:
  push:
  pull_request:

jobs:
  validate-discovery-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 code/discovery_loop.py validate
      - run: python3 machinery/validate.py
      - run: python3 machinery/test_bound_contract.py
      - run: python3 machinery/test_cpu_ledger.py
      - run: python3 machinery/test_validate.py
