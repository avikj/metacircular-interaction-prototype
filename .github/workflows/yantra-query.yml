name: Yantra arbitrary query

on:
  workflow_dispatch:
    inputs:
      query_json:
        description: 'One JSON request for the Yantra wire'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/yantra-query.yml'
      - 'research/yantra-query.json'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Agda toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/agda
            ~/.cache/cubical-v0.9
            ~/.agda-pin
            ~/.cabal
          key: yantra-agda-2.8.0-cubical-v0.9
      - name: Install pinned kernel
        run: sh setup
      - name: Select query
        env:
          DISPATCH_QUERY: ${{ inputs.query_json }}
        run: |
          if [ -n "${DISPATCH_QUERY:-}" ]; then
            printf '%s\n' "$DISPATCH_QUERY" > "$RUNNER_TEMP/query.jsonl"
          else
            cp research/yantra-query.json "$RUNNER_TEMP/query.jsonl"
          fi
          cat "$RUNNER_TEMP/query.jsonl"
      - name: Ask the machine
        run: |
          sh interactive/run-yantra.sh --wire < "$RUNNER_TEMP/query.jsonl" | tee "$RUNNER_TEMP/answer.jsonl"
      - name: Retain exact query and answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yantra-query-answer
          path: |
            ${{ runner.temp }}/query.jsonl
            ${{ runner.temp }}/answer.jsonl
          retention-days: 30
